server:
  port: 8081

spring:
  application:
    name: docvoice-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret

app:
  jwt:
    secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWRvY3ZvaWNlLWp3dC10b2tlbnM=
    expiration: 86400000
  ai:
    gemini-key-1: test-key-1
    gemini-key-2: test-key-2
    gemini-base-url: https://generativelanguage.googleapis.com
    gemini-model: gemini-3.6-flash
